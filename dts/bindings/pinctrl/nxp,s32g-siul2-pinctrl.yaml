description: NXP S32G SIUL2 pin controller

compatible: "nxp,s32g-siul2-pinctrl"

include: base.yaml

child-binding:
  child-binding:
    include:
      - name: pincfg-node.yaml
        property-allowlist:
          - bias-disable
          - bias-pull-down
          - bias-pull-up
          - input-enable
          - output-enable
          - drive-open-drain

    properties:
      pinmux:
        required: true
        type: array

      slew-rate:
        type: string
        enum:
          - "fastest"
          - "slowest"
        default: "fastest"

      nxp,slew-rate:
        type: int
        enum: [0, 1, 2, 3, 4, 5, 6, 7]
        description: |
          Raw MSCR SRE encoding for voltage-dependent pad slew rates.
          Overrides slew-rate when present. RGMII pads at 3.3 V use encoding 5.
