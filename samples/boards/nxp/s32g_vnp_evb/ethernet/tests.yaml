sample:
  name: S32G M7 upper board GMAC UDP echo
tests:
  sample.boards.nxp.s32g.ethernet:
    platform_allow:
      - s32g_vnp_evb/s32g274a/m7_0
    integration_platforms:
      - s32g_vnp_evb/s32g274a/m7_0
    tags:
      - ethernet
      - net
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "UDP log task started: 10 ms"
        - "UDP echo ready; awaiting PHY link and packets"
