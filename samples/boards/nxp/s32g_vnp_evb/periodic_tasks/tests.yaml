sample:
  name: S32G M7 periodic tasks, counted events and UDP networking
tests:
  sample.boards.nxp.s32g.periodic_tasks:
    platform_allow:
      - s32g_vnp_evb/s32g274a/m7_0
    integration_platforms:
      - s32g_vnp_evb/s32g274a/m7_0
    tags:
      - gpio
      - kernel
      - ethernet
      - net
    harness: console
    harness_config:
      type: multi_line
      ordered: false
      regex:
        - "Periodic tasks started"
        - "task_10ms"
        - "task_100ms"
        - "UDP log task started: 10 ms"
        - "UDP echo ready; awaiting PHY link and packets"
